{n:"FASE 1 — CONSTRUIR A BASE",s:"2026-10-01",m:"Postura, guarda, deslocamento, distância, jab, direto, low kick, teep e defesa básica. Técnica > volume > intensidade.",f:["Postura, guarda e base","Jab, direto e distância","Low kick e teep","Defesa básica e equilíbrio","Integração da base"],pr:["Guarda e base sólidas","Jab, direto, low kick e teep limpos","Defesa básica automática","Base de força e aeróbica","Controlar a intensidade"],ph:"Base de força e aeróbica"},

const EX={
corda:["Pular corda","Salto leve e contínuo com corda.","Pés juntos na ponta dos pés, cotovelos colados ao corpo, os punhos giram a corda.","Ritmo, panturrilha e coordenação: base do trabalho de pernas no ringue.","Saltar alto demais; girar a corda com os braços inteiros.","Panturrilha aquecida, respiração subindo sem ofegar.","Sem corda: saltitos e polichinelos."],
mobd:["Mobilidade dinâmica","Movimentos amplos e controlados.","Círculos de quadril, agachamento profundo com pausa, rotação torácica, círculos de ombro, balanço de perna.","Prepara quadril, tornozelo e ombro para chutar, esquivar e girar.","Ir rápido demais; forçar amplitude.","Articulações soltas, mais amplitude, sem dor.","—"],
sombra:["Sombra com objetivo","Luta contra adversário imaginário com tema definido.","Guarda alta, queixo protegido. Trabalhe só o tema do dia. Rounds de 3 min.","Automatiza técnica, distância e movimentação sem equipamento.","Socar sem mexer os pés; ignorar a defesa; usar como cardio.","Respiração controlada e técnica limpa até o último round.","Pouco espaço: mesmo padrão em área menor, foco nos giros."],

medball:["Arremesso rotacional","Lançar a bola na parede girando quadril e tronco.","De lado para a parede, pés firmes: gire quadril, tronco, depois braços; lance forte e recolha. Troque de lado.","Transfere força do chão ao cruzado, ao chute e à joelhada.","Girar só os braços; bola pesada demais.","Quadril iniciando o movimento, sem fadiga entre repetições.","Sem medicine ball: elástico ou cabo com rotação rápida."],
agach:["Agachamento (ou trap bar)","Agachamento com barra; trap bar como opção.","Pés na largura dos ombros, tronco firme, desça até o quadril passar a linha dos joelhos, suba empurrando o chão.","Força de pernas para chutes, deslocamento e clinch.","Joelhos para dentro; perder a coluna neutra; RPE alto demais.","Coxas e glúteos trabalhando, lombar estável.","Sem barra: goblet com halter ou leg press."],

supino:["Supino (ou flexão)","Empurrada horizontal.","Escápulas fixas, desça a barra ao peito controlada, suba firme.","Força de empurrada para jab, direto e clinch.","Ombros à frente; rebote no peito.","Peitoral e tríceps; ombro estável.","Sem barra: flexões ou halteres."],
aerob:["Aeróbico leve","Corrida ou bike em ritmo de conversa.","Mantenha um ritmo em que consiga falar frases inteiras.","Base aeróbica para recuperar entre rounds e entre treinos.","Ir forte demais.","Respiração calma, sem esgotar.","Corrida, bike ou o que houver."],
intv:["Intervalos curtos","Tiros fortes com pausa ativa.","Tiro de 30 s em alta intensidade (corda, bike, corrida ou sombra forte), depois pausa ativa leve.","Repetir explosões, como trocação seguida de recuperação.","Começar forte demais e cair na metade.","Esforço alto, mas repetível até a última série.","Bike, corrida, corda ou sombra forte."],
espec:["Condicionamento específico","Rounds com golpes, movimento, clinch e explosão.","Round de 3 min: combinações, deslocamento, uma explosão de 10 s, joelhada/clinch, recuperação ativa, nova explosão.","Aproxima o físico da demanda real de uma luta.","Perder a técnica quando cansa.","Esforço de luta com técnica preservada.","Sombra + saco/aparador quando houver."],
pallof:["Pallof press","Empurrar elástico ou cabo à frente sem girar.","De lado ao cabo, mãos no peito, estenda os braços resistindo à rotação, volte devagar.","Anti-rotação: transfere força e dá estabilidade ao golpear.","Deixar o tronco girar; ombros elevados.","Abdômen lateral firme.","Sem cabo ou elástico: prancha lateral."],
prancha:["Prancha","Sustentar o corpo alinhado.","Antebraços no chão, glúteos e abdômen contraídos, quadril alinhado, respire.","Anti-extensão: protege a lombar e absorve golpes.","Quadril caído; prender a respiração.","Abdômen firme, sem dor lombar.","Prancha com joelhos apoiados."],
pescoco:["Pescoço isométrico","Empurrar a cabeça contra a mão sem mover.","Sentado, mão na testa, lado ou nuca; empurre com ~50% da força por 10 s. Sem rotação com carga.","Pescoço forte reduz o impacto dos golpes.","Força máxima; empurrar com dor.","Tensão leve e uniforme no pescoço.","Dor ou formigamento: pare e procure avaliação profissional."],
mob:["Mobilidade","Alongamentos ativos de tornozelo, quadril, adutores, posterior, torácica e ombro.","Tornozelo na parede, 90/90 de quadril, borboleta, posterior de coxa, rotação torácica, ombro na parede: 30–45 s cada.","Amplitude para chutar sem perder base e recuperar entre treinos.","Forçar até doer.","Alongamento leve a moderado, sem dor.","—"],
swing:["Kettlebell swing","Balanço explosivo com kettlebell.","Quadril para trás, kettlebell entre as pernas, estenda o quadril com força; os braços só guiam.","Potência de quadril para chutes e deslocamento.","Agachar em vez de dobrar o quadril; puxar com os braços.","Glúteos e posterior; lombar neutra.","Sem kettlebell: halter ou salto agachado."],
split:["Split squat / afundo","Agachamento unilateral.","Passo à frente, tronco reto, desça o joelho de trás controlado, suba com a perna da frente.","Equilíbrio e força unilateral, como nos chutes e no apoio.","Joelho para dentro; passo curto demais.","Coxa e glúteo da perna da frente.","Sem halteres: só o peso do corpo."],
rdl:["Levantamento romeno (RDL)","Movimento de quadril com barra ou halteres.","Quadril para trás, joelhos levemente flexionados, barra perto das pernas; sinta o posterior alongar e volte.","Posterior e glúteos: aceleração, chutes e proteção do joelho.","Arredondar as costas; barra longe do corpo.","Posterior de coxa alongando, lombar neutra.","Trap bar ou halteres."],

low:["Low kick","Chute baixo na coxa.","Pise fora, gire o quadril, bata com a canela na coxa e volte à base.","Desgasta a perna do adversário e controla a distância.","Sem giro do quadril; baixar a guarda.","Giro completo do quadril e base recuperada.","—"],

mid:["Middle e high kick","Chutes giratórios ao tronco e à cabeça.","Gire o pé de apoio e o quadril, chute com a canela e volte à base. High kick só com mobilidade adequada, progressivamente.","Alcance e potência; o high kick entra aos poucos.","Chutar só com a perna; pé de apoio fixo.","Giro completo e base segura ao voltar.","—"],
